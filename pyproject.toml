[project]
name = "kalshi-data"
version = "0.1.0"
description = "Kalshi Research Data Engine: discover Kalshi markets and retrieve, store, inspect and export public market data for research."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",      # HTTP client with connection pooling and explicit timeouts
    "typer>=0.12",      # command-line interface
    "rich>=13.7",       # terminal progress and tables
    "pydantic>=2.6",    # configuration validation
    "pyarrow>=15",      # Parquet export with decimal128 columns
]

[project.optional-dependencies]
# pandas is only needed for DataFrame helpers and the research examples.
research = ["pandas>=2.1"]

[project.scripts]
kalshi-data = "kalshi_data.cli:app"

[dependency-groups]
dev = [
    "pandas>=2.1",
    "pytest>=8",
    "respx>=0.21",      # httpx request mocking for offline tests
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kalshi_data"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: opt-in tests that call the real Kalshi API (set KALSHI_LIVE_TESTS=1)"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF002", "RUF003", "B008"]

[tool.mypy]
python_version = "3.11"
files = ["src/kalshi_data"]
strict = true
plugins = ["pydantic.mypy"]
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*", "pandas", "pandas.*"]
ignore_missing_imports = true
